<!DOCTYPE html>
<html>
<head>
  <title>SVG Shapes Examples</title>
</head>
<body>

<h2>SVG 5 Shapes Example</h2>

<svg width="600" height="400">

  <!-- 1. Square -->
  <rect x="20" y="20" width="100" height="100"
        fill="lightblue" stroke="black"/>

  <!-- 2. Rectangle -->
  <rect x="150" y="20" width="180" height="100"
        fill="lightgreen" stroke="black"/>

  <!-- 3. Circle -->
  <circle cx="80" cy="220" r="50"
          fill="orange" stroke="black"/>

  <!-- 4. Ellipse -->
  <ellipse cx="250" cy="220" rx="80" ry="50"
           fill="pink" stroke="black"/>

  <!-- 5. Triangle -->
  <polygon points="400,300 500,300 450,200"
           fill="yellow" stroke="black"/>

</svg>

</body>
</html>
